[project]
name = "qualitycheck"
version = "0.0.0"
description = "One local quality check of a Python project, published with the project itself."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Cédric SILEO" }]
requires-python = ">=3.10"
dependencies = [
    "bandit[toml]>=1.8",
    "pylint>=3.3",
    "pytest>=8",
    "pytest-cov>=6",
    "radon>=6",
    "ruff>=0.17",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
qualitycheck = "qualitycheck.cli:main"

[dependency-groups]
dev = [
    "pytest-bdd>=8",
    "syrupy>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
bdd_features_base_dir = "tests/bdd/features"

[tool.ruff]
target-version = "py310"
extend-exclude = ["test-cases/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "B", "C90", "UP", "SIM", "RET", "PIE", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.uv]
# pytest-bdd 9.0.0 fails on pytest 9.2.0 (FixtureManager._arg2fixturedefs removed).
constraint-dependencies = ["pytest<9.2"]
