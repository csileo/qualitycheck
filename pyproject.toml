[project]
name = "qualitycheck"
version = "0.0.0"
description = "One local quality check of a Python project, recorded in the project itself."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Cédric SILEO" }]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-bdd>=8",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
bdd_features_base_dir = "tests/bdd/features"

[tool.ruff]
target-version = "py310"
extend-exclude = ["test-cases/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "B", "C90", "UP", "SIM", "RET", "PIE", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]
